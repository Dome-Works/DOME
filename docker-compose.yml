services:
  api:
    build:
      context: ./src/HomelabDocs.Server
      dockerfile: HomelabDocs.Api/Dockerfile
    ports:
      - "5100:8080"
    volumes:
      # Only needed for a local unix socket. Remove when using a remote tcp:// endpoint.
      - ${DOCKER_SOCKET_PATH:-/var/run/docker.sock}:/var/run/docker.sock:ro
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      # Local: unix:///var/run/docker.sock (default)
      # Remote: tcp://host.example:2375
      Docker__Endpoint: ${DOCKER_ENDPOINT:-unix:///var/run/docker.sock}
    restart: unless-stopped

  client:
    build:
      context: ./src/HomelabDocs.Client
      dockerfile: Dockerfile
    ports:
      - "5200:80"
    depends_on:
      - api
    restart: unless-stopped
