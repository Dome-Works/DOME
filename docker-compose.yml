services:
  api:
    image: ghcr.io/homelabdocs/server:latest
    ports:
      - "5100:8080"
    volumes:
      # Only needed when a connection uses the local unix socket.
      - ${DOCKER_SOCKET_PATH:-/var/run/docker.sock}:/var/run/docker.sock:ro
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      # Devices come from appsettings.json. Uncomment to override or add here;
      # each index replaces the matching appsettings entry.
      # Docker__Connections__0__Name: Local
      # Docker__Connections__0__Endpoint: unix:///var/run/docker.sock
      # Docker__Connections__1__Name: ${DOCKER_DEVICE_1_NAME}
      # Docker__Connections__1__Endpoint: ${DOCKER_DEVICE_1_ENDPOINT}
    restart: unless-stopped

  client:
    image: ghcr.io/homelabdocs/client:latest
    ports:
      - "5200:80"
    depends_on:
      - api
    restart: unless-stopped
