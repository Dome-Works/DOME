name: Docker

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: docker-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docker:
    name: Build and scan Docker images
    runs-on: ubuntu-latest

    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Build Server Image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: src/HomelabDocs.Server
          file: src/HomelabDocs.Server/HomelabDocs.Api/Dockerfile
          push: false
          load: true
          tags: homelabdocs-server:scan

      - name: Build Client Image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: src/HomelabDocs.Client
          file: src/HomelabDocs.Client/Dockerfile
          push: false
          load: true
          tags: homelabdocs-client:scan

      - name: Scan Server Image
        id: scan-server
        continue-on-error: true
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: homelabdocs-server:scan
          format: sarif
          output: trivy-server.sarif
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"

      - name: Upload Server Scan
        if: always() && hashFiles('trivy-server.sarif') != ''
        uses: github/codeql-action/upload-sarif@5595ccaf912efad79be6eef63a5619ff05969be3 # v4
        with:
          sarif_file: trivy-server.sarif
          category: trivy-server

      - name: Scan Client Image
        id: scan-client
        continue-on-error: true
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: homelabdocs-client:scan
          format: sarif
          output: trivy-client.sarif
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"

      - name: Upload Client Scan
        if: always() && hashFiles('trivy-client.sarif') != ''
        uses: github/codeql-action/upload-sarif@5595ccaf912efad79be6eef63a5619ff05969be3 # v4
        with:
          sarif_file: trivy-client.sarif
          category: trivy-client

      - name: Fail on CRITICAL/HIGH vulnerabilities
        if: always() && (steps.scan-server.outcome == 'failure' || steps.scan-client.outcome == 'failure')
        run: |
          echo "Trivy found unfixed CRITICAL/HIGH vulnerabilities."
          exit 1

