name: Docker

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

concurrency:
  group: docker-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docker:
    name: Build and scan Docker images
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Build Server Image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: src/HomelabDocs.Server
          file: src/HomelabDocs.Server/HomelabDocs.Api/Dockerfile
          push: false
          load: true
          tags: homelabdocs-server:scan

      - name: Build Client Image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: src/HomelabDocs.Client
          file: src/HomelabDocs.Client/Dockerfile
          push: false
          load: true
          tags: homelabdocs-client:scan

      - name: Scan Server Image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: homelabdocs-server:scan
          format: sarif
          output: trivy-server.sarif
          severity: CRITICAL,HIGH
          ignore-unfixed: true

      - name: Upload Server Scan
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-server.sarif
          category: trivy-server

      - name: Scan Client Image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: homelabdocs-client:scan
          format: sarif
          output: trivy-client.sarif
          severity: CRITICAL,HIGH
          ignore-unfixed: true

      - name: Upload Client Scan
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-client.sarif
          category: trivy-client

