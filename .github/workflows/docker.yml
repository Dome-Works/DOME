name: Docker

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions: {}

concurrency:
  group: docker-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PLATFORMS: linux/amd64,linux/arm64

jobs:
  docker:
    name: Build Docker images
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Build Server Image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: src/HomelabDocs.Server/HomelabDocs.Api/Dockerfile
          platforms: ${{ env.PLATFORMS }}
          push: false
          tags: homelabdocs-server:ci

      - name: Build Socket Image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: src/HomelabDocs.Socket/HomelabDocs.Socket.Api/Dockerfile
          platforms: ${{ env.PLATFORMS }}
          push: false
          tags: homelabdocs-socket:ci

      - name: Build Client Image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: src/HomelabDocs.Client
          file: src/HomelabDocs.Client/Dockerfile
          platforms: ${{ env.PLATFORMS }}
          push: false
          tags: homelabdocs-client:ci