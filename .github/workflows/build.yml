name: Build, test, and analyze

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Build and test
    runs-on: ubuntu-latest

    permissions:
      contents: read
      actions: read
      checks: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: global.json

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: src/Dome.Client/package-lock.json

      - name: .NET Restore
        run: dotnet restore Dome.slnx

      - name: Build .NET
        run: dotnet build Dome.slnx --configuration Release --no-restore

      - name: Test .NET
        run: |
          dotnet test Dome.slnx \
            --configuration Release \
            --no-build \
            --verbosity normal \
            --report-xunit-trx \
            --report-xunit-trx-filename "test-results.trx" \
            --results-directory "${{ github.workspace }}/TestResults"

      - name: Test report
        uses: dorny/test-reporter@a43b3a5f7366b97d083190328d2c652e1a8b6aa2 # v3.0.0
        if: ${{ !cancelled() }}
        with:
          name: .NET Tests
          path: TestResults/**/*.trx
          reporter: dotnet-trx

      - name: Install JavaScript dependencies
        working-directory: src/Dome.Client
        run: npm ci --ignore-scripts

      - name: Lint JavaScript
        working-directory: src/Dome.Client
        run: npm run lint

      - name: Build JavaScript
        working-directory: src/Dome.Client
        run: npm run build

  docker:
    name: Docker
    needs: verify
    permissions:
      contents: read
    uses: $/.github/workflows/docker.yml
