name: Build Full Repository

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dotnet:
    name: Build .NET
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: src/HomelabDocs.Server/global.json

      - name: Restore
        run: dotnet restore src/HomelabDocs.Server/HomelabDocs.slnx

      - name: Build
        run: dotnet build src/HomelabDocs.Server/HomelabDocs.slnx --configuration Release --no-restore

  javascript:
    name: Build JavaScript
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: src/HomelabDocs.Client/package-lock.json

      - name: Install
        working-directory: src/HomelabDocs.Client
        run: npm ci

      - name: Build
        working-directory: src/HomelabDocs.Client
        run: npm run build
