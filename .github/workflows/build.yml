name: Build Full Repository

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dotnet:
    name: Build .NET
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: src/HomelabDocs.Server/global.json

      - name: Restore
        run: dotnet restore src/HomelabDocs.Server/HomelabDocs.slnx

      - name: Build
        run: dotnet build src/HomelabDocs.Server/HomelabDocs.slnx --configuration Release --no-restore

  javascript:
    name: Build JavaScript
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: src/HomelabDocs.Client/package-lock.json

      - name: Install
        working-directory: src/HomelabDocs.Client
        run: npm ci --ignore-scripts

      - name: Build
        working-directory: src/HomelabDocs.Client
        run: npm run build
