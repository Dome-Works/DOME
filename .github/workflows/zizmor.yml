name: Zizmor

on:
  push:
    branches:
      - main
  pull_request:
  schedule:
    - cron: "15 7 * * 1"
  workflow_dispatch:

permissions: {}

jobs:
  zizmor:
    name: Analyze GitHub Actions
    runs-on: ubuntu-latest

    permissions:
      security-events: write
      contents: read
      actions: read

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Run zizmor
        uses: zizmorcore/zizmor-action@v0.5.7
