services:
  api:
    build:
      context: .
      dockerfile: src/Dome.Server/Dome.Api/Dockerfile
      args:
        DOME_ENVIRONMENT: Test
      no_cache: true
    image: dome/server:local
    container_name: dome-server
    ports:
      - "127.0.0.1:5100:8080"
    volumes:
      - dome-data:/var/lib/dome
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__Dome: Data Source=/var/lib/dome/dome.db
    restart: unless-stopped

  socket:
    build:
      context: .
      dockerfile: src/Dome.Socket/Dome.Socket.Api/Dockerfile
      no_cache: true
    image: dome/socket:local
    container_name: dome-socket
    ports:
      - "5110:8080"
    volumes:
      - ${DOCKER_SOCKET_PATH:-/var/run/docker.sock}:/var/run/docker.sock
      - ${DOME_COMPOSE_ROOT:-/var/lib/dome/compose}:/var/lib/dome/compose
      - socket-data:/var/lib/dome-socket
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      DOME_SOCKET_KEY: ${DOME_SOCKET_KEY:-}
    restart: unless-stopped

  client:
    build:
      context: ./src/Dome.Client
      dockerfile: Dockerfile
      no_cache: true
    image: dome/client:local
    container_name: dome-client
    ports:
      - "5200:80"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  dome-data:
  socket-data:
