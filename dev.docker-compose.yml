services:
  api:
    build:
      context: .
      dockerfile: src/Dome.Server/Dome.Api/Dockerfile
      no_cache: true
    image: dome/server:local
    ports:
      - "5100:8080"
    volumes:
      # SQLite save directory. Survives image pulls. For host-visible
      # backups or a future rclone/Google Drive sidecar, bind-mount instead:
      # - ./data:/var/lib/dome
      - dome-data:/var/lib/dome
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__Dome: Data Source=/var/lib/dome/dome.db
    restart: unless-stopped

  socket:
    build:
      context: .
      dockerfile: src/Dome.Socket/Dome.Socket.Api/Dockerfile
      no_cache: true
    image: dome/socket:local
    ports:
      - "5110:8080"
    volumes:
      - ${DOCKER_SOCKET_PATH:-/var/run/docker.sock}:/var/run/docker.sock
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      Docker__Endpoint: unix:///var/run/docker.sock
    restart: unless-stopped

  client:
    build:
      context: ./src/Dome.Client
      dockerfile: Dockerfile
      no_cache: true
    image: dome/client:local
    ports:
      - "5200:80"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  dome-data:
